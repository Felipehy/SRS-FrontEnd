# Este arquivo é um TEMPLATE: o entrypoint do nginx roda envsubst e gera
# /etc/nginx/conf.d/default.conf. Só ${API_UPSTREAM} é substituído
# (NGINX_ENVSUBST_FILTER); as variáveis do nginx ($uri, $host, $http_*) ficam intactas.
server {
    listen 8080;
    server_name _;

    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # O browser chama /api; o nginx (dentro do firewall, junto do backend) repassa.
    # Sem CORS, e o endereço interno da API NÃO vai para o bundle do browser.
    # ${API_UPSTREAM} vem de env (ex.: ECS task definition) — formato "host:porta".
    location /api/ {
        proxy_pass http://${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Repassa a identidade que o ALB injetou (o backend pode validar a assinatura).
        proxy_set_header X-Amzn-Oidc-Data        $http_x_amzn_oidc_data;
        proxy_set_header X-Amzn-Oidc-Accesstoken $http_x_amzn_oidc_accesstoken;
        proxy_set_header X-Amzn-Oidc-Identity    $http_x_amzn_oidc_identity;

        # O backend lê Bearer: injetamos AQUI o access token do Cognito (fornecido pelo
        # ALB) como Authorization.
        proxy_set_header Authorization "Bearer $http_x_amzn_oidc_accesstoken";

        # Upload de anexos (POST /api/anexos). O padrão do nginx é 1m e cortaria
        # qualquer foto de celular. Fica ACIMA do max-file-size do Spring (50MB) de
        # propósito: assim quem recusa é o backend, com JSON que o interceptor de
        # api/lib/api.ts sabe ler — o 413 do nginx vem em HTML e a tela mostraria só
        # "Requisição inválida".
        client_max_body_size 55m;
        proxy_request_buffering off;
        # Rede lenta com arquivo de dezenas de MB estoura o padrão de 60s.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }

    # Assets têm hash no nome → cache longo e imutável.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # O index.html nunca é cacheado, senão o navegador não pega deploys novos.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Reexpõe os headers que o ALB injetou, para o SPA montar o usuário. Lido só
    # para exibir/gatear a UI — a autorização de verdade é no backend (proxy /api).
    location = /auth/userinfo {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"data":"$http_x_amzn_oidc_data","accessToken":"$http_x_amzn_oidc_accesstoken"}';
    }

    # Expira o cookie de sessao do ALB E redireciona pro /logout do Cognito. Sem
    # limpar o cookie do ALB, o usuario voltaria logado (o ALB nao re-desafia).
    # O botao "Sair" do app aponta pra ca (VITE_COGNITO_LOGOUT_URL=/logout).
    #
    # ⚠ A URL do Hosted UI e HARDCODE de proposito. Se um dia voltar a ser env, a
    # var TEM de estar na task definition antes do deploy.
    #
    # Formato: https://<dominio-do-hosted-ui>/logout?client_id=<id>&logout_uri=<url-do-app-encodada>
    # O logout_uri precisa estar cadastrado como "Allowed sign-out URL" no app client.
    location = /logout {
        add_header Set-Cookie "AWSELBAuthSessionCookie-0=; Path=/; Max-Age=0; Secure; HttpOnly" always;
        add_header Set-Cookie "AWSELBAuthSessionCookie-1=; Path=/; Max-Age=0; Secure; HttpOnly" always;
        add_header Cache-Control "no-store" always;
        return 302 "https://auth.example.com/logout?client_id=SEU_CLIENT_ID&logout_uri=https%3A%2F%2Fapp.example.com%2F";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
